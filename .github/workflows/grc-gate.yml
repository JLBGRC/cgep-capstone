name: grc-gate-cgep-capstone

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: tflint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint --recursive

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.70.0

      - name: opa test
        run: opa test ./policies -v

      - name: detection fixture tests
        run: python3 -m unittest discover -s detections -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: semgrep
        run: |
          python3 -m pip install --upgrade "semgrep>=1.80"
          semgrep scan --config auto --severity ERROR --error .

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml
          soft_fail_on: LOW,MEDIUM
          quiet: true
          output_format: cli,json
          output_file_path: console,checkov-results.json
          download_external_modules: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-${{ github.run_id }}
          path: checkov-results.json
          retention-days: 90

  policy-gate:
    needs: [lint, validate, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -out=tfplan -no-color > plan.txt
          terraform show -json tfplan > plan.json

      - name: Conftest policy gate
        id: conftest
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          mkdir -p ../evidence
          {
            echo "["
            FIRST=1
            for ns in \
              compliance.hipaa.gap01_s3_cmk \
              compliance.hipaa.gap02_ddb_cmk \
              compliance.hipaa.gap03_tls \
              compliance.hipaa.gap04_versioning \
              compliance.hipaa.gap05_vpc \
              compliance.hipaa.gap06_resilience \
              compliance.hipaa.gap07_least_privilege \
              compliance.hipaa.gap08_api_logs
            do
              [[ $FIRST -eq 1 ]] && FIRST=0 || printf ","
              conftest test --policy ../policies --namespace "$ns" --output=json plan.json || true
            done
            echo "]"
          } > ../evidence/conftest-results.json
          python3 -c '
          import json
          d = json.load(open("../evidence/conftest-results.json"))
          fails = sum(len(r.get("failures") or []) for results in d for r in results)
          print(f"conftest failures: {fails}")
          '

      - name: Copy plan into evidence
        if: always()
        run: |
          cp ${{ env.TF_WORKING_DIR }}/plan.json evidence/plan.json
          cp ${{ env.TF_WORKING_DIR }}/plan.txt  evidence/plan.txt

      - name: Bundle + sign + upload to vault
        id: sign
        if: always()
        env:
          VAULT: ${{ vars.EVIDENCE_VAULT }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          ( cd evidence && tar czf "../${BUNDLE}" . )
          shasum -a 256 "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"
          cosign sign-blob --yes --bundle "${BUNDLE}.sig.bundle" "${BUNDLE}"
          KEY_PREFIX="runs/${RUN_ID}"
          aws s3 cp "${BUNDLE}"            "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}"
          aws s3 cp "${BUNDLE}.sha256"     "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sha256"
          aws s3 cp "${BUNDLE}.sig.bundle" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sig.bundle"
          VERSION_ID=$(aws s3api head-object --bucket "${VAULT}" --key "${KEY_PREFIX}/${BUNDLE}" --query VersionId --output text)
          cat > receipt.json <<EOF
          {
            "run_id":"${RUN_ID}",
            "vault":"${VAULT}",
            "bundle_key":"${KEY_PREFIX}/${BUNDLE}",
            "version_id":"${VERSION_ID}",
            "sha256":"$(cat ${BUNDLE}.sha256)",
            "commit":"${SHA}"
          }
          EOF
          aws s3 cp receipt.json "s3://${VAULT}/${KEY_PREFIX}/receipt.json"
          echo "Receipt:" && cat receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grc-evidence-${{ github.run_id }}
          path: |
            evidence/
            evidence-${{ github.run_id }}-*.tar.gz
            evidence-${{ github.run_id }}-*.sig.bundle
            evidence-${{ github.run_id }}-*.sha256
            receipt.json
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## GRC gate run #${{ github.run_id }}

            - Conftest: `${{ steps.conftest.outcome }}`
            - Sign + vault upload: `${{ steps.sign.outcome }}`

            Bundle in vault: `s3://${{ vars.EVIDENCE_VAULT }}/runs/${{ github.run_id }}/`

            Verify locally:
            ```bash
            scripts/verify-evidence.sh ${{ github.run_id }}
            ```

      - name: Decide pass/fail
        id: gate
        if: always()
        run: |
          python3 -c '
          import json, sys
          d = json.load(open("evidence/conftest-results.json"))
          fails = sum(len(r.get("failures") or []) for results in d for r in results)
          print(f"final conftest failures: {fails}")
          sys.exit(0 if fails == 0 else 1)
          '

      - name: Terraform apply
        if: github.event_name != 'pull_request' && steps.gate.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
